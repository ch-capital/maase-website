<!DOCTYPE html>
<html>
<head>
    <script>
        // 检测浏览器语言，如果是中文就跳到 /zh，否则跳到 /en
        var lang = navigator.language || navigator.userLanguage;
        if (lang.indexOf('zh') > -1) {
            window.location.href = './zh/';
        } else {
            window.location.href = './en/';
        }
    </script>
</head>
<body>
    <p>Redirecting...</p>
</body>
</html>
